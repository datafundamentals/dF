name: Deploy Firebase Teaching App to Production

# Trigger deployment on:
# 1. Push to main branch (automatic deployment)
# 2. Manual trigger from Actions tab (workflow_dispatch)
on:
  push:
    branches:
      - main
    paths:
      - 'apps/df-firebase-teaching-app/**'
      - 'packages/**'
      - '.github/workflows/deploy-firebase-teaching-app.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    
    # Only deploy from main branch for security
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better caching
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared packages
        run: |
          pnpm --filter @df/types run build
          pnpm --filter @df/state run build
          pnpm --filter @df/firebase run build
          pnpm --filter @df/ui-lit run build
      
      - name: Create .env.production from secrets
        working-directory: apps/df-firebase-teaching-app
        run: |
          cat > .env.production << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          VITE_USE_EMULATOR=false
          VITE_FIREBASE_EMULATOR_UI=http://127.0.0.1:5400
          EOF
      
      - name: Run security rules tests
        run: pnpm --filter @df/df-firebase-teaching-app test:rules
      
      - name: Build production app
        run: pnpm --filter @df/df-firebase-teaching-app build:prod
      
      - name: Check build output
        run: |
          ls -la apps/df-firebase-teaching-app/dist/
          echo "Build completed successfully"
      
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          target: df-firebase-teaching-app
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
      
      - name: Deploy Cloud Functions
        if: success()
        working-directory: apps/df-firebase-teaching-app
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}
      
      - name: Deploy Security Rules
        if: success()
        working-directory: apps/df-firebase-teaching-app
        run: |
          firebase deploy --only firestore:rules,storage --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}
      
      - name: Post deployment summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "📦 Deployed components:"
          echo "  - Firebase Hosting (app)"
          echo "  - Cloud Functions"
          echo "  - Security Rules (Firestore + Storage)"
          echo ""
          echo "🌐 Production URL: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
          echo ""
          echo "📊 Next steps:"
          echo "  1. Test deployed app at production URL"
          echo "  2. Monitor Firebase Console for errors"
          echo "  3. Check usage quotas in Firebase Console"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs above for error details."
          echo "Common issues:"
          echo "  - Missing GitHub Secrets"
          echo "  - Firebase project not configured"
          echo "  - Build errors"
          echo "  - Security rules test failures"

  # Optional: Preview deployment for pull requests
  preview:
    name: Preview Deployment (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared packages
        run: |
          pnpm --filter @df/types run build
          pnpm --filter @df/state run build
          pnpm --filter @df/firebase run build
          pnpm --filter @df/ui-lit run build
      
      - name: Create .env.production from secrets
        working-directory: apps/df-firebase-teaching-app
        run: |
          cat > .env.production << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          VITE_USE_EMULATOR=false
          VITE_FIREBASE_EMULATOR_UI=http://127.0.0.1:5400
          EOF
      
      - name: Build production app
        run: pnpm --filter @df/df-firebase-teaching-app build:prod
      
      - name: Deploy to preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          # Creates temporary preview URL for this PR
          expires: 7d
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
