name: Standards Compliance

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']

jobs:
  md3-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10.18.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: MD3 compliance scanner
        run: pnpm --filter @df/compliance-tools run check:md3

      - name: Standards documentation check
        run: pnpm --filter @df/compliance-tools run check:docs

      - name: Forbidden patterns check
        run: pnpm --filter @df/compliance-tools run check:patterns

      - name: Run lint suite
        run: pnpm lint
