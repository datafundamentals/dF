<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DF Firebase Teaching App</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: 'Roboto', sans-serif;
        color: #0f172a;
      }

      body {
        flex-direction: column;
        gap: 40px;
        padding: 40px 20px;
      }

      df-firestore-demo {
        width: min(1200px, 90vw);
      }

      df-storage-demo {
        width: min(1200px, 90vw);
      }

      df-functions-demo {
        width: min(1200px, 90vw);
      }
    </style>
  </head>
  <body>
    <!-- Environment banner shown only in dev mode (when VITE_USE_EMULATOR=true) -->
    <df-environment-banner id="env-banner"></df-environment-banner>
    <df-auth-wrapper>
      <df-firestore-demo></df-firestore-demo>
      <df-storage-demo></df-storage-demo>
      <df-functions-demo></df-functions-demo>
    </df-auth-wrapper>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Hide banner in production (when VITE_USE_EMULATOR is false or missing)
      if (import.meta.env.VITE_USE_EMULATOR !== 'true') {
        document.getElementById('env-banner').style.display = 'none';
      }
    </script>
  </body>
</html>
