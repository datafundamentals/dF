<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatty Cathy Work Request System</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: 'Roboto', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--md-sys-color-surface, #f8fafc);
        color: var(--md-sys-color-on-surface, #0f172a);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--md-sys-color-surface, #f8fafc);
      }
      df-auth-wrapper {
        display: block;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <df-environment-banner id="env-banner"></df-environment-banner>
    <df-auth-wrapper headless>
      <df-openclaw-chat-app></df-openclaw-chat-app>
    </df-auth-wrapper>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Hide banner in production (when VITE_USE_EMULATOR !== 'true')
      if (import.meta.env.VITE_USE_EMULATOR !== 'true') {
        document.getElementById('env-banner').style.display = 'none';
      }
    </script>
  </body>
</html>
